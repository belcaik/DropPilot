name: Test and release portable ZIPs
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'if(process.env.GITHUB_REF_NAME !== "v"+require("./package.json").version)throw new Error("Tag must match package.json version")'
      - run: npm run prepare:browser
      - name: Build portable archive
        run: npx --no-install electron-builder --${{ matrix.platform }} zip --${{ matrix.arch }} --publish never
      - name: Extract portable ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-Item dist/*.zip
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "$env:RUNNER_TEMP/DropPilot-check"
      - name: Extract portable ZIP (Linux)
        if: runner.os == 'Linux'
        run: unzip -q dist/*.zip -d "$RUNNER_TEMP/DropPilot-check"
      - name: Extract portable ZIP (macOS)
        if: runner.os == 'macOS'
        run: ditto -x -k dist/*.zip "$RUNNER_TEMP/DropPilot-check"
      - name: Launch extracted application
        if: runner.os != 'Linux'
        run: npm run test:packaged
        env:
          DROP_PILOT_PACKAGE_DIR: ${{ runner.temp }}/DropPilot-check
      - name: Launch extracted application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
        env:
          DROP_PILOT_PACKAGE_DIR: ${{ runner.temp }}/DropPilot-check
      - name: Generate checksum
        run: node scripts/checksum.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: portable-*
          path: release-assets
          merge-multiple: true
      - name: Publish all tested archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "DropPilot $RELEASE_TAG" --generate-notes
          fi
