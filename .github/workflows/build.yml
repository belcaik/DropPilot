name: Test and release portable ZIPs
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  draft:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate version and create draft
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          node -e 'const fs=require("fs");const tag=process.env.RELEASE_TAG;if(!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)||tag!=="v"+require("./package.json").version)throw Error("Tag must match package.json version");fs.appendFileSync(process.env.GITHUB_OUTPUT,"tag="+tag+"\n")'
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "DropPilot $RELEASE_TAG" --generate-notes
          fi
  package:
    needs: draft
    permissions:
      contents: write
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.draft.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run prepare:browser
      - name: Build portable archive
        run: npx --no-install electron-builder --${{ matrix.platform }} zip --${{ matrix.arch }} --publish never
      - name: Extract portable ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-Item dist/*.zip
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath "$env:RUNNER_TEMP/DropPilot-check"
      - name: Extract portable ZIP (Linux)
        if: runner.os == 'Linux'
        run: unzip -q dist/*.zip -d "$RUNNER_TEMP/DropPilot-check"
      - name: Extract portable ZIP (macOS)
        if: runner.os == 'macOS'
        run: ditto -x -k dist/*.zip "$RUNNER_TEMP/DropPilot-check"
      - name: Launch extracted application
        if: runner.os != 'Linux'
        run: npm run test:packaged
        env:
          DROP_PILOT_PACKAGE_DIR: ${{ runner.temp }}/DropPilot-check
      - name: Launch extracted application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
        env:
          DROP_PILOT_PACKAGE_DIR: ${{ runner.temp }}/DropPilot-check
      - name: Generate checksum
        run: node scripts/checksum.mjs
      - name: Upload tested ZIP directly to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.draft.outputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
  release:
    name: Publish completed release
    needs: [draft, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify all assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.draft.outputs.tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets > assets.json
          node -e 'const a=require("./assets.json").assets;for(const p of ["win-x64","linux-x64","mac-x64","mac-arm64"]){const n="DropPilot-"+process.env.RELEASE_TAG.slice(1)+"-"+p+".zip";if(!a.some(x=>x.name===n)||!a.some(x=>x.name===n+".sha256"))throw Error("Missing assets for "+p)}'
          gh release edit "$RELEASE_TAG" --draft=false --latest
